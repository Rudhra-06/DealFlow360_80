<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealFlow360 — B2B Commercial Orchestration Platform</title>
  <meta name="description" content="DealFlow360 Enterprise B2B Commercial Orchestration Platform Workspace." />
  <meta http-equiv="refresh" content="0; url=frontend/index.html" />
  <script type="text/javascript">
    window.location.replace("frontend/index.html");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F7F8FA;
      color: #172A46;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .redirect-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(23, 42, 70, 0.08);
      max-width: 420px;
      width: 90%;
      border: 1px solid #E2E8F0;
    }
    .brand-logo {
      font-size: 28px;
      font-weight: 700;
      color: #172A46;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #172A46 0%, #0F1C2E 100%);
      color: #19B5A5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .accent {
      color: #19B5A5;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #E2E8F0;
      border-top-color: #19B5A5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .link {
      color: #19B5A5;
      text-decoration: none;
      font-weight: 500;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand-logo">
      <div class="logo-icon">DF</div>
      <span>DealFlow<span class="accent">360</span></span>
    </div>
    <div class="spinner"></div>
    <p style="color: #64748B; font-size: 14px; margin-top: 10px;">Launching DealFlow360 Enterprise Platform...</p>
    <p style="font-size: 13px; color: #94A3B8; margin-top: 20px;">
      If you are not redirected automatically, <a href="frontend/index.html" class="link">click here to open application</a>.
    </p>
  </div>
</body>
</html>
