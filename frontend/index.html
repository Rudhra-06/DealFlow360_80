<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealFlow360 | Sales Intelligence & Commercial Operations</title>
  <meta name="description" content="DealFlow360 — Enterprise B2B Deal Management, Quotation Intelligence, and Commercial Operations Platform Workspace." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/quotations.css" />
  <link rel="stylesheet" href="css/approvals.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/negotiation.css" />
  <link rel="stylesheet" href="css/notifications.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/billing.css" />
  <link rel="stylesheet" href="css/dealHealth.css" />
  <link rel="stylesheet" href="css/analytics.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Full-Page Initialization Loader -->
  <div id="page-loader" class="page-loader-overlay">
    <div class="brand-logo" style="color: var(--color-navy); font-size: var(--font-size-2xl);">
      <div class="logo-icon" style="width: 40px; height: 40px; font-size: 1.1rem;">DF</div>
      <span>DealFlow<span class="logo-accent" style="color: var(--color-teal);">360</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: 10px;">
      <span class="spinner spinner-teal"></span>
      <span>Loading DealFlow360 workspace...</span>
    </div>
  </div>

  <!-- Mobile Drawer Backdrop -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Application Shell -->
  <div class="app-shell">
    <!-- Left Navigation Sidebar -->
    <aside id="app-sidebar" class="app-sidebar">
      <!-- Sidebar Brand Header -->
      <div class="sidebar-brand">
        <div class="brand-logo" style="font-size: var(--font-size-lg);">
          <div class="logo-icon">DF</div>
          <span>DealFlow<span class="logo-accent">360</span></span>
        </div>
      </div>

      <!-- Dynamic Role-Aware Navigation Menu -->
      <nav id="sidebar-nav-container" class="sidebar-nav-container" aria-label="Main Navigation">
        <!-- Rendered dynamically by navigation.js based on authenticated role -->
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <span>DealFlow360 Phase 3</span>
        <span class="badge badge-teal" style="font-size: 0.65rem; padding: 2px 6px;">v3.0.0</span>
      </div>
    </aside>

    <!-- Main Content Workspace Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Toggle navigation drawer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="header-title-area">
            <h2 id="header-view-title" class="header-title">Dashboard</h2>
            <span id="header-view-breadcrumb" class="header-breadcrumb">DealFlow360 / Workspace Overview</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Live API Connectivity Indicator -->
          <div id="header-connection-indicator" class="connection-indicator">
            <span class="status-dot status-dot-teal status-dot-pulse"></span>
            <span>Connecting...</span>
          </div>

          <!-- Real-Time Notification Bell -->
          <div class="notification-bell-wrapper">
            <button id="header-notif-btn" class="notif-bell-btn" title="Notifications" aria-label="Notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span id="header-notif-badge" class="notif-badge" style="display: none;">0</span>
            </button>
          </div>

          <!-- User Profile & Dropdown -->
          <div class="user-dropdown-wrapper">
            <button
              id="user-menu-trigger"
              class="user-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="User profile menu"
            >
              <div id="header-user-avatar" class="user-avatar">DF</div>
              <div class="user-meta">
                <span id="header-user-name" class="user-meta-name">Loading...</span>
                <span id="header-user-role" class="user-meta-role">Role</span>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-muted);">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            <!-- Dropdown Menu Content -->
            <div id="user-dropdown-menu" class="dropdown-menu" role="menu">
              <div class="dropdown-header">
                <div id="dropdown-user-name" class="dropdown-header-name">User</div>
                <div id="dropdown-user-email" class="dropdown-header-email">user@example.com</div>
                <div style="margin-top: 6px;">
                  <span id="dropdown-user-role-badge" class="badge badge-navy">Role</span>
                </div>
              </div>
              <button class="dropdown-item" id="dropdown-view-profile" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>View Account Profile</span>
              </button>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item danger" id="dropdown-logout-btn" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Content Area -->
      <main id="main-view-container" class="content-area">
        <!-- Rendered dynamically by view controllers -->
      </main>
    </div>
  </div>

  <!-- Modal Overlay Container -->
  <div id="dealflow-modal-overlay" class="modal-overlay"></div>

  <!-- Slide-out Drawer Container -->
  <div id="dealflow-drawer-backdrop" class="drawer-backdrop"></div>
  <div id="dealflow-drawer-panel" class="drawer-panel"></div>

  <!-- Toast Container -->
  <div id="dealflow-toast-container" class="toast-container"></div>

  <!-- Core JavaScript Services -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/ui.js"></script>

  <!-- Master Data & Commercial Config API Clients -->
  <script src="js/api/customerTiers.js"></script>
  <script src="js/api/customers.js"></script>
  <script src="js/api/productCategories.js"></script>
  <script src="js/api/products.js"></script>
  <script src="js/api/warehouses.js"></script>
  <script src="js/api/inventory.js"></script>
  <script src="js/api/discountPolicies.js"></script>
  <script src="js/api/approvalPolicies.js"></script>
  <script src="js/api/billingPlans.js"></script>

  <!-- Phase 3 API Service Clients -->
  <script src="js/api/quotations.js"></script>
  <script src="js/api/recommendationRules.js"></script>

  <!-- Phase 4 Real-Time & Notification Services -->
  <script src="js/realtime/websocket.js"></script>
  <script src="js/notifications/notifications-api.js"></script>
  <script src="js/notifications/notification-center.js"></script>

  <!-- Phase 4 API Service Clients -->
  <script src="js/portal/portal-api.js"></script>
  <script src="js/negotiation/negotiation-api.js"></script>

  <!-- View Controllers -->
  <script src="js/views/dashboardView.js"></script>
  <script src="js/views/customersView.js"></script>
  <script src="js/views/productsView.js"></script>
  <script src="js/views/inventoryView.js"></script>
  <script src="js/views/discountPoliciesView.js"></script>
  <script src="js/views/approvalPoliciesView.js"></script>
  <script src="js/views/billingPlansView.js"></script>
  <script src="js/views/settingsView.js"></script>

  <!-- Phase 3 View Controllers -->
  <script src="js/views/quotationsView.js"></script>
  <script src="js/views/quotationBuilderView.js"></script>
  <script src="js/views/approvalsView.js"></script>
  <script src="js/views/recommendationRulesView.js"></script>

  <!-- Phase 4 View Controllers -->
  <script src="js/portal/portalView.js"></script>
  <script src="js/views/negotiationsView.js"></script>

  <!-- Phase 5 API Service Clients -->
  <script src="js/api/orders.js"></script>
  <script src="js/api/fulfillment.js"></script>
  <script src="js/api/shipments.js"></script>
  <script src="js/api/billing.js"></script>
  <script src="js/api/invoices.js"></script>
  <script src="js/api/subscriptions.js"></script>
  <script src="js/api/creditNotes.js"></script>
  <script src="js/api/payments.js"></script>

  <!-- Phase 5 View Controllers -->
  <script src="js/views/ordersView.js"></script>
  <script src="js/views/orderDetailView.js"></script>
  <script src="js/views/invoicesView.js"></script>
  <script src="js/views/subscriptionsView.js"></script>
  <script src="js/views/paymentsView.js"></script>

  <!-- Phase 6 Part 1 API Service Clients -->
  <script src="js/api/dealHealth.js"></script>
  <script src="js/api/dealAlerts.js"></script>

  <!-- Phase 6 Part 1 View Controllers -->
  <script src="js/views/dealHealthView.js"></script>
  <script src="js/views/dealAlertsView.js"></script>
  <script src="js/views/dealHealthConfigView.js"></script>

  <!-- Phase 6 Part 2 API Service Clients (Analytics, Customer 360, Reports) -->
  <script src="js/api/analytics.js"></script>
  <script src="js/api/reports.js"></script>

  <!-- Phase 6 Part 2 View Controllers -->
  <script src="js/views/analyticsView.js"></script>
  <script src="js/views/customer360View.js"></script>
  <script src="js/views/reportsView.js"></script>

  <!-- Phase 6 Part 3 System & Demo Readiness -->
  <script src="js/api/system.js"></script>
  <script src="js/views/demoReadinessView.js"></script>

  <!-- Main App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
