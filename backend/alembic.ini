# Alembic Configuration for DealFlow360 Backend

[alembic]
# Path to migration scripts directory
script_location = alembic

# Prepend backend directory to sys.path so alembic can import app modules
prepend_sys_path = .

# Version file format pattern (e.g. 001_initial_schema_baseline.py)
file_template = %%(rev)s_%%(slug)s

# sys.path path filter
# sys_path = .

# timezone to use when rendering dates in migration files
# timezone = UTC

# max length of characters in slug field
# max_slug_length = 40

# Database URL is intentionally NOT hardcoded here.
# Alembic retrieves database configuration dynamically from app.core.config.settings
# inside alembic/env.py to prevent hardcoding credentials in repository files.
sqlalchemy.url = 

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
